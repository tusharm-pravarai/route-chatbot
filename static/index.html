<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Routing Test Chatbot</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --muted: #8b93a3;
    --accent: #5b8cff;
    --user-bubble: #5b8cff;
    --bot-bubble: #232733;
    --ollama: #34c38f;
    --openai: #ffb648;
    --kb: #9b7bff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header span { font-size: 12px; color: var(--muted); }
  main {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  .chat-panel {
    flex: 2;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    min-width: 0;
  }
  .trace-panel {
    flex: 1;
    min-width: 280px;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .trace-panel h2, .chat-panel h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 0;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg { display: flex; flex-direction: column; max-width: 75%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 9px 13px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .msg.user .bubble { background: var(--user-bubble); color: white; border-bottom-right-radius: 2px; }
  .msg.bot .bubble { background: var(--bot-bubble); border-bottom-left-radius: 2px; }
  .meta {
    margin-top: 4px;
    font-size: 11px;
    color: var(--muted);
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .badge {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .badge.ollama { background: rgba(52,195,143,0.15); color: var(--ollama); }
  .badge.openai { background: rgba(255,182,72,0.15); color: var(--openai); }
  .badge.knowledge_base { background: rgba(155,123,255,0.15); color: var(--kb); }
  .badge.error { background: rgba(255,90,90,0.15); color: #ff5a5a; }
  form#composer {
    display: flex;
    gap: 8px;
    padding: 14px 16px;
    border-top: 1px solid var(--border);
  }
  #input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    outline: none;
  }
  #input:focus { border-color: var(--accent); }
  select#forceModel {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 0 8px;
    font-size: 12px;
  }
  button#send {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-size: 14px;
    cursor: pointer;
  }
  button#send:disabled { opacity: 0.5; cursor: default; }
  #traceList {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .trace-row {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
  }
  .trace-row .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .trace-row .msg-preview { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trace-row .reason { color: var(--muted); font-size: 11px; margin-top: 3px; }
  .trace-row .time { color: var(--muted); font-size: 10px; }
  .empty-hint { color: var(--muted); font-size: 12px; padding: 16px; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>Routing Test Chatbot</h1>
  <span id="sessionLabel"></span>
</header>

<main>
  <section class="chat-panel">
    <div id="messages"></div>
    <form id="composer">
      <select id="forceModel" title="Force a specific backend, or let the router decide">
        <option value="">auto (router decides)</option>
        <option value="ollama">force: ollama</option>
        <option value="openai">force: openai</option>
      </select>
      <input id="input" type="text" placeholder="Type a message..." autocomplete="off" />
      <button id="send" type="submit">Send</button>
    </form>
  </section>

  <section class="trace-panel">
    <h2>Routing Trace (live)</h2>
    <div id="traceList">
      <div class="empty-hint">Requests will appear here as they're routed.</div>
    </div>
  </section>
</main>

<script>
const sessionId = "session-" + Math.random().toString(36).slice(2, 10);
document.getElementById("sessionLabel").textContent = sessionId;

const messagesEl = document.getElementById("messages");
const traceListEl = document.getElementById("traceList");
const form = document.getElementById("composer");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const forceModelEl = document.getElementById("forceModel");

function addMessage(role, text, modelUsed, routeReason) {
  const msg = document.createElement("div");
  msg.className = "msg " + role;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  msg.appendChild(bubble);

  if (role === "bot") {
    const meta = document.createElement("div");
    meta.className = "meta";
    const badge = document.createElement("span");
    badge.className = "badge " + modelUsed;
    badge.textContent = modelUsed;
    meta.appendChild(badge);
    if (routeReason) {
      const reason = document.createElement("span");
      reason.textContent = routeReason;
      meta.appendChild(reason);
    }
    msg.appendChild(meta);
  }

  messagesEl.appendChild(msg);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function sendMessage(text) {
  addMessage("user", text);
  const forceModel = forceModelEl.value || null;

  sendBtn.disabled = true;
  try {
    const resp = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, session_id: sessionId, force_model: forceModel }),
    });
    const data = await resp.json();
    if (!resp.ok) {
      addMessage("bot", "Error: " + (data.detail || resp.statusText), "error", "request failed");
    } else {
      addMessage("bot", data.response, data.model_used, data.route_reason);
    }
  } catch (err) {
    addMessage("bot", "Network error: " + err.message, "error", "request failed");
  } finally {
    sendBtn.disabled = false;
    fetchTraces();
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  sendMessage(text);
});

function renderTraces(traces) {
  if (!traces.length) {
    traceListEl.innerHTML = '<div class="empty-hint">Requests will appear here as they\'re routed.</div>';
    return;
  }
  traceListEl.innerHTML = "";
  for (const t of traces) {
    const row = document.createElement("div");
    row.className = "trace-row";
    const time = new Date(t.timestamp).toLocaleTimeString();
    row.innerHTML = `
      <div class="top">
        <span class="badge ${t.model_used}">${t.model_used}</span>
        <span class="time">${time} · ${t.latency_ms}ms</span>
      </div>
      <div class="msg-preview">${escapeHtml(t.message)}</div>
      <div class="reason">${escapeHtml(t.route_reason)}</div>
    `;
    traceListEl.appendChild(row);
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

async function fetchTraces() {
  try {
    const resp = await fetch("/traces");
    const data = await resp.json();
    renderTraces(data);
  } catch (err) {
    // trace panel is best-effort; ignore polling errors
  }
}

fetchTraces();
setInterval(fetchTraces, 4000);
</script>

</body>
</html>
